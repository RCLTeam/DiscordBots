[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liga-bot"
version = "0.1.0"
description = "Modular Discord Bot for RCL with SQLAlchemy 2.0 and PGlite persistence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.6.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "py-pglite[sqlalchemy]>=0.5.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
liga-bot = "liga_bot.__main__:main"
liga-cli = "liga_bot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/liga_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:'audioop' is deprecated:DeprecationWarning:discord.player",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["liga_bot.py"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
]
ignore = []
