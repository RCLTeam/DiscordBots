# A generic, single database configuration for LigaBot.

[alembic]
# Path to migration scripts (relative to repository root)
script_location = alembic

# Prepend src to sys.path so env.py can import liga_bot packages
prepend_sys_path = src

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Path separator for multi-platform compatibility
path_separator = os

# Default database URL for offline generation or fallback
# Left empty by default so env.py dynamically falls back to Settings().database_url (pglite:///:memory:)
sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
